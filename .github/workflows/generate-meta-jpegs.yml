name: Generate Meta JPEG product images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-meta-jpegs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image converter
        run: npm install --no-save sharp@0.33.5

      - name: Convert Hunk Thermo photos to JPEG
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          Promise.all([
            sharp('photos/hunk-thermo-black-01.webp')
              .jpeg({ quality: 92 })
              .toFile('photos/hunk-thermo-black-01.jpg'),
            sharp('photos/hunk-thermo-khaki-01.webp')
              .jpeg({ quality: 92 })
              .toFile('photos/hunk-thermo-khaki-01.jpg')
          ]).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit JPEG images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add photos/hunk-thermo-black-01.jpg photos/hunk-thermo-khaki-01.jpg
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Add JPEG feed images for Hunk Thermo'
            git push
          fi

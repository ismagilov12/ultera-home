name: Generate Meta JPEG product images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-meta-jpegs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Keep dynamic product feed fresh
        run: |
          sed -i 's/public, max-age=600, s-maxage=600, stale-while-revalidate=3600/no-store/g' api/feed.js

      - name: Commit feed cache fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add api/feed.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Disable stale caching for dynamic product feed'
            git push
          fi

name: Generate Meta JPEG product images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-meta-jpegs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Create a unique Meta image URL
        run: cp photos/hunk-thermo-black-01.jpg photos/hunk-thermo-black-feed.jpg

      - name: Commit Meta image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add photos/hunk-thermo-black-feed.jpg
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Add cache-busted Hunk Thermo feed image'
            git push
          fi

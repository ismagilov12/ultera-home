name: Patch autumn and winter thermo selector

on:
  push:
    branches:
      - feat/autumn-winter-thermo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autumn-winter-thermo
          fetch-depth: 0
      - name: Patch storefront season selector
        run: python3 scripts/patch_autumn_winter.py
      - name: Commit storefront patch and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-autumn-winter.yml scripts/patch_autumn_winter.py
          git add index.html
          git commit -m "feat: replace summer selector with autumn and winter thermo"
          git push origin HEAD:feat/autumn-winter-thermo

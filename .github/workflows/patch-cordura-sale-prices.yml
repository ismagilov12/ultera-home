name: Patch Cordura sale prices

on:
  push:
    branches: [fix/cordura-sale-prices]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cordura-sale-prices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch storefront price logic
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let s = fs.readFileSync(file, 'utf8');
          const saleUids = "['809858137952','924701650982','454860479882']";

          const reps = [
            ["const extra = (id === 'spring') ? 700 : 0;", `const extra = (id === 'spring' && !${saleUids}.includes(String(p.uid))) ? 700 : 0;`],
            ["const seasonExtra = seasonId === 'spring' ? 700 : 0;  // v178: сума-дубль вітрини; авторитетна — в RPC", `const seasonExtra = seasonId === 'spring' && !${saleUids}.includes(String(p.uid)) ? 700 : 0;  // Cordura promo: selected UIDs have no uplift; authoritative total is in RPC`]
          ];
          for (const [from,to] of reps) {
            const n = s.split(from).length - 1;
            if (n !== 1) throw new Error(`Expected 1 occurrence, got ${n}: ${from}`);
            s = s.replace(from,to);
          }

          const anchor = "    if (_sn) _sn.textContent = 'Літо';\n  } catch(_){}";
          const inject = `    if (_sn) _sn.textContent = 'Літо';\n    var _corduraPromo = ${saleUids}.includes(String(p.uid));\n    var _springLabel = document.querySelector('.season-btn[data-season=\"spring\"] .season-txt b');\n    if (_springLabel) _springLabel.textContent = _corduraPromo ? 'Весна / Осінь' : 'Весна / Осінь · +700 ₴';\n  } catch(_){}`;
          if ((s.split(anchor).length - 1) !== 1) throw new Error('openModal season anchor mismatch');
          s = s.replace(anchor, inject);

          const line = "  const n = document.getElementById('m_season_name'); if(n) n.textContent = label;";
          const repl = `  const n = document.getElementById('m_season_name');\n  if(n){\n    const _promo = ${saleUids}.includes(String((window.__modalUid || currentColor || '')));\n    n.textContent = (id === 'spring' && _promo) ? 'Весна / Осінь' : label;\n  }`;
          if ((s.split(line).length - 1) !== 1) throw new Error('pickSeason label anchor mismatch');
          s = s.replace(line, repl);

          fs.writeFileSync(file, s, 'utf8');
          NODE

      - name: Verify and commit final patch
        shell: bash
        run: |
          grep -F "['809858137952','924701650982','454860479882']" index.html
          rm -f .github/workflows/patch-cordura-sale-prices.yml cordura-price-fix-note.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/patch-cordura-sale-prices.yml cordura-price-fix-note.txt
          git commit -m 'fix: keep promo Cordura prices flat on selected models'
          git push origin HEAD:fix/cordura-sale-prices

<script>
const R=JSON.parse(document.getElementById('LIB').textContent);
const G=document.getElementById('grid'),Q=document.getElementById('q'),F=document.getElementById('fam'),C=document.getElementById('cnt');
let ST='';
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fb(img){
  if(!img.dataset.f){img.dataset.f=1;img.src=img.src.replace('https://ultera.in.ua/','https://ultera-home.vercel.app/');}
  else{img.style.visibility='hidden';}
}
function shot(p){ return p?`<div><img loading="lazy" src="${esc(p)}" onerror="fb(this)"></div>`:`<div><div class="nph">—</div></div>`; }
function match(r,q){
  if(!q)return true;
  const h=[r.uid,r.article,r.title,r.family,r.color,(r.sizes||[]).join(' ')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(t=>h.includes(t));
}
function render(){
  const q=Q.value.trim(),f=F.value;
  const list=R.filter(r=>match(r,q)&&(!f||r.family===f)&&(!ST||r.status===ST));
  C.textContent=list.length+' з '+R.length;
  G.innerHTML=list.map(r=>{
    const i=R.indexOf(r);
    const bd=r.status==='живе'?'<span class="badge liv">ЖИВЕ</span>'
      :(r.status==='прихована'?'<span class="badge hid">ПРИХОВАНА</span>':'<span class="badge arc">АРХІВ</span>');
    return `<article class="card" onclick="open_(${i})">
      <div class="shots">${shot(r.ph[0])}${shot(r.ph[1])}${shot(r.ph[2])}${bd}</div>
      <div class="b"><div class="fam">${esc(r.family)}</div>
      <div class="nm">${esc(r.title)}</div>
      <div class="uid">${esc(r.uid)}</div></div></article>`;
  }).join('')||'<p style="color:#7a776e">Нічого не знайдено.</p>';
}
function open_(i){
  const r=R[i];
  document.getElementById('dc').innerHTML=`<div class="mh"><div>
      <div class="fam">${esc(r.family)} · ${esc(r.status)}</div>
      <div style="font-size:21px;font-weight:700;margin-top:3px">${esc(r.title)}</div>
      <div class="uid">артикул ${esc(r.uid)}${r.article?' · '+esc(r.article):''}</div>
    </div><button class="x" onclick="document.getElementById('dlg').close()">×</button></div>
    <div class="mb"><div class="big">
      ${r.ph.map(p=>`<img src="${esc(p)}" onerror="fb(this)">`).join('')}
    </div>
    <div class="meta">
      <span>Колір · <b>${esc(r.color)||'—'}</b></span>
      <span>Розміри · <b>${(r.sizes||[]).join(' · ')||'—'}</b></span>
      <span>Всього фото в базі · <b>${r.all}</b></span>
    </div></div>`;
  document.getElementById('dlg').showModal();
}
Q.addEventListener('input',render);F.addEventListener('change',render);
document.querySelectorAll('button.f').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('button.f').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');ST=b.dataset.st;render();});
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});
render();
</script></body></html>

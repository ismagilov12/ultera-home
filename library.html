<script>

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>v?Math.round(v).toLocaleString('uk-UA')+' \u20b4':'—';
function match(r,q){
  if(!q)return true;
  const h=[r.uid,r.article,r.title,r.family,r.color_name,(r.sizes||[]).join(' '),r.desc_short,(r.notes||[]).join(' ')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(t=>h.includes(t));
}
function render(){
  const q=Q.value.trim(),f=F.value;
  const list=R.filter(r=>match(r,q)&&(!f||r.family===f)&&(!ST||r.status===ST));
  C.textContent=list.length+' з '+R.length;
  G.innerHTML=list.map((r,i)=>{
    const idx=R.indexOf(r);
    const ph=r.photos&&r.photos[0]?`<img loading="lazy" src="${esc(r.photos[0])}" onerror="fb(this)">`:`<div class="nph">без фото</div>`;
    const bd=r.status==='живе'?'<span class="badge liv">ЖИВЕ</span>':(r.status==='прихована'?'<span class="badge hid">ПРИХОВАНА</span>':'<span class="badge arc">АРХІВ</span>');
    const po=r.price_old&&r.price&&r.price_old>r.price?`<s>${money(r.price_old)}</s>`:'';
    return `<article class="card" onclick="open_(${idx})">
      <div class="ph">${ph}${bd}</div>
      <div class="b"><div class="fam">${esc(r.family)}</div>
      <div class="nm">${esc(r.title.replace(/^ULTERA\s*[-\u2013]\s*/,''))}</div>
      <div class="uid">${esc(r.uid)}</div>
      <div class="szs">${(r.sizes||[]).join(' · ')||'розміри не вказані'}</div>
      <div class="pr">${money(r.price)}${po}</div></div></article>`;
  }).join('')||'<p style="color:#7a776e">Нічого не знайдено.</p>';
}
let CUR=null;
function open_(i){
  const r=R[i];CUR=r;
  const dc=document.getElementById('dc');
  const gal=r.photos&&r.photos.length?`<div class="gal"><img id="big" src="${esc(r.photos[0])}" onerror="fb(this)">
    <div class="thumbs">${r.photos.slice(0,15).map((p,k)=>`<img class="${k?'':'a'}" src="${esc(p)}" onerror="fb(this)" onclick="sw(this,'${esc(p)}')">`).join('')}</div></div>`
    :`<div class="gal"><div class="nph" style="height:260px;position:static;display:grid">без фото</div></div>`;
  const po=r.price_old?`<s style="color:#7a776e">${money(r.price_old)}</s>`:'';
  dc.innerHTML=`<div class="mh"><div>
      <div class="fam">${esc(r.family)} · ${r.status}</div>
      <div style="font-size:21px;font-weight:700;margin-top:3px">${esc(r.title)}</div>
      <div class="uid" style="margin-top:4px">артикул ${esc(r.uid)}</div>
    </div><button class="x" onclick="document.getElementById('dlg').close()">×</button></div>
    <div class="mb">${gal}<div>
      <dl class="kv">
        <dt>Артикул</dt><dd><b>${esc(r.uid)}</b>${r.article?' · '+esc(r.article):''}</dd>
        <dt>Лінійка</dt><dd>${esc(r.family)}</dd>
        <dt>Колір</dt><dd>${esc(r.color_name)}</dd>
        <dt>Ціна</dt><dd><b>${money(r.price)}</b> ${po}</dd>
        <dt>Розміри</dt><dd>${(r.sizes||[]).join(' · ')||'—'}</dd>
        <dt>Мітка</dt><dd>${esc(r.mark)||'—'}</dd>
        <dt>Стать</dt><dd>${esc(r.gender)||'—'}</dd>
        <dt>Період</dt><dd>${esc(r.first_seen_s)} → ${esc(r.last_seen_s)}</dd>
        <dt>Фото</dt><dd>${(r.photos||[]).length}</dd>
      </dl>
      <div>${(r.sources||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
      ${(r.notes||[]).length?`<div style="margin-top:8px">${r.notes.map(n=>`<span class="tag">${esc(n)}</span>`).join('')}</div>`:''}
      ${(r.links||[]).length?`<div style="margin-top:10px;font-size:12.5px">${r.links.map(l=>`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l.slice(0,70))}…</a>`).join('<br>')}</div>`:''}
      ${r.status==='архів'?'<div class="note">Немає в базі — модель відновлено з фідів / архівних версій каталогу.</div>':''}
      ${r.status==='прихована'?'<div class="note">Є в базі, але published=false — на сайті не показується. Щоб повернути: увімкнути публікацію в адмінці.</div>':''}
      <div class="desc">${esc(r.desc_long||r.desc_short||'Опис не зберігся.')}</div>
    </div></div>`;
  document.getElementById('dlg').showModal();
}
function fb(img){if(!img.dataset.f){img.dataset.f=1;img.src=img.src.replace('https://ultera.in.ua/','https://ultera-home.vercel.app/');}else{img.style.display='none';}}
function sw(el,src){document.getElementById('big').src=src;
  [...el.parentNode.children].forEach(x=>x.classList.remove('a'));el.classList.add('a');}
Q.addEventListener('input',render);F.addEventListener('change',render);
document.querySelectorAll('button.f').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('button.f').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');ST=b.dataset.st;render();});
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});
render();
</script></body></html>
